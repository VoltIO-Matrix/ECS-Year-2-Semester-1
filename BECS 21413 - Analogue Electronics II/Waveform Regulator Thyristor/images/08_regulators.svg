<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
<rect width="1120" height="560" fill="#ffffff"/>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#2C2C2B} .title{font-size:28px;font-weight:700} .txt{font-size:20px} .small{font-size:16px} .tiny{font-size:14px} .wire{stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round} .axis{stroke:#7D7A75;stroke-width:2;fill:none;stroke-linecap:round} .blue{stroke:#2783DE;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .green{stroke:#46A171;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .orange{stroke:#D5803B;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .red{stroke:#E56458;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .box{fill:#F9F8F7;stroke:#E6E5E3;stroke-width:2} .note{fill:#E5F2FC;stroke:#2783DE;stroke-width:2} .op{fill:#F0EFED;stroke:#2C2C2B;stroke-width:3}
</style>

<text x="35" y="45" class="t title">Voltage regulators — keep Vout nearly constant</text>
<g transform="translate(70,95)"><rect x="0" y="65" width="210" height="110" rx="14" class="note"/><text x="48" y="112" class="t txt">Regulator</text><text x="28" y="145" class="t small">Vin, load, temp change</text><line x1="-45" y1="120" x2="0" y2="120" class="wire"/><line x1="210" y1="120" x2="290" y2="120" class="wire"/><text x="-45" y="105" class="t small">Vin</text><text x="300" y="125" class="t small">Vout</text><text x="0" y="245" class="t txt">Line regulation</text><text x="0" y="280" class="t small">% = (ΔVout/ΔVin)×100%</text><text x="0" y="335" class="t txt">Load regulation</text><text x="0" y="370" class="t small">% = (ΔVout/ΔIload)×100%</text><text x="0" y="405" class="t small">or % = [(VNL−VFL)/VFL]×100%</text></g>
<g transform="translate(640,95)"><text x="0" y="0" class="t txt">Series vs shunt</text><rect x="0" y="60" width="330" height="100" rx="14" class="note"/><text x="25" y="100" class="t small">Series regulator: pass transistor is in series with load.</text><text x="25" y="130" class="t small">More efficient than shunt in many cases.</text><rect x="0" y="210" width="330" height="125" rx="14" class="note"/><text x="25" y="250" class="t small">Shunt regulator: control transistor is parallel with load.</text><text x="25" y="280" class="t small">Less efficient, but inherent short-circuit protection.</text><text x="25" y="310" class="t small">Short current limited by series resistor.</text></g>

</svg>