<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
<rect width="1120" height="560" fill="#ffffff"/>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#2C2C2B} .title{font-size:28px;font-weight:700} .txt{font-size:20px} .small{font-size:16px} .tiny{font-size:14px} .wire{stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round} .axis{stroke:#7D7A75;stroke-width:2;fill:none;stroke-linecap:round} .blue{stroke:#2783DE;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .green{stroke:#46A171;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .orange{stroke:#D5803B;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .red{stroke:#E56458;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .box{fill:#F9F8F7;stroke:#E6E5E3;stroke-width:2} .note{fill:#E5F2FC;stroke:#2783DE;stroke-width:2} .op{fill:#F0EFED;stroke:#2C2C2B;stroke-width:3}
</style>

<text x="35" y="45" class="t title">Wien-bridge and RC phase-shift oscillators</text>
<g transform="translate(70,105)">
<text x="0" y="0" class="t txt">Wien-bridge oscillator</text><rect x="0" y="55" width="250" height="95" rx="14" class="note"/><text x="55" y="110" class="t txt">non-inverting amp</text><line x1="250" y1="102" x2="350" y2="102" class="wire"/><rect x="350" y="55" width="250" height="95" rx="14" class="note"/><text x="385" y="90" class="t txt">Wien bridge</text><text x="388" y="120" class="t small">β = 1/3 at fo</text><path d="M520 150 V225 H90 V150" class="wire"/><text x="0" y="270" class="t small">At fo: phase shift = 0°, attenuation β = 1/3</text><text x="0" y="305" class="t small">Need amplifier gain Av = 3 so Avβ = 1</text><text x="0" y="340" class="t small">If R1=R2=R and C1=C2=C: fo = 1/(2πRC)</text>
</g>
<g transform="translate(70,405)"><text x="0" y="0" class="t txt">RC phase-shift oscillator</text><rect x="295" y="-35" width="120" height="55" rx="10" class="note"/><text x="330" y="0" class="t small">RC 60°</text><rect x="430" y="-35" width="120" height="55" rx="10" class="note"/><text x="465" y="0" class="t small">RC 60°</text><rect x="565" y="-35" width="120" height="55" rx="10" class="note"/><text x="600" y="0" class="t small">RC 60°</text><line x1="0" y1="-8" x2="295" y2="-8" class="wire"/><line x1="685" y1="-8" x2="850" y2="-8" class="wire"/><text x="0" y="55" class="t small">RC network gives 180°. Inverting amplifier gives another 180°.</text><text x="0" y="88" class="t small">fo = 1/(2π√6 RC), and amplifier gain magnitude must be about 29.</text></g>

</svg>