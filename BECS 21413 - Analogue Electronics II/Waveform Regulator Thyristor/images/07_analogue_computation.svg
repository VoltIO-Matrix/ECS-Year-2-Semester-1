<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="470" viewBox="0 0 1050 470">
<rect width="1050" height="470" fill="#ffffff"/>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#2C2C2B} .title{font-size:28px;font-weight:700} .txt{font-size:20px} .small{font-size:16px} .tiny{font-size:14px} .wire{stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round} .axis{stroke:#7D7A75;stroke-width:2;fill:none;stroke-linecap:round} .blue{stroke:#2783DE;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .green{stroke:#46A171;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .orange{stroke:#D5803B;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .red{stroke:#E56458;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .box{fill:#F9F8F7;stroke:#E6E5E3;stroke-width:2} .note{fill:#E5F2FC;stroke:#2783DE;stroke-width:2} .op{fill:#F0EFED;stroke:#2C2C2B;stroke-width:3}
</style>

<text x="35" y="45" class="t title">Analogue computation using op-amp integrator</text>
<g transform="translate(80,105)"><text x="0" y="0" class="t txt">Integrator solves by accumulating area</text><line x1="0" y1="135" x2="130" y2="135" class="wire"/><path d="M130 135 l10 -16 l10 32 l10 -32 l10 32 l10 -32 l10 16" class="wire"/><line x1="200" y1="135" x2="320" y2="135" class="wire"/><polygon points="320,75 320,195 480,135" class="op"/><line x1="480" y1="135" x2="600" y2="135" class="wire"/><path d="M380 135 V45 H545 V135" class="wire"/><line x1="445" y1="30" x2="445" y2="60" class="wire"/><line x1="465" y1="30" x2="465" y2="60" class="wire"/><text x="145" y="105" class="t small">R</text><text x="440" y="25" class="t small">C</text><text x="0" y="120" class="t small">Vin</text><text x="615" y="140" class="t small">Vo</text><text x="0" y="270" class="t small">Vo = −(1/RC)∫Vin dt</text><text x="0" y="305" class="t small">If Vin is constant, output is a ramp.</text><text x="0" y="340" class="t small">Used to solve differential equations in analogue computers.</text></g>

</svg>