<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460">
<rect width="980" height="460" fill="#ffffff"/>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#2C2C2B} .title{font-size:28px;font-weight:700} .txt{font-size:20px} .small{font-size:16px} .wire{stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round} .axis{stroke:#7D7A75;stroke-width:2;fill:none;stroke-linecap:round} .blue{stroke:#2783DE;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .green{stroke:#46A171;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .orange{stroke:#D5803B;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .red{stroke:#E56458;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .box{fill:#F9F8F7;stroke:#E6E5E3;stroke-width:2} .note{fill:#E5F2FC;stroke:#2783DE;stroke-width:2} .op{fill:#F0EFED;stroke:#2C2C2B;stroke-width:3}
</style>

<text x="35" y="45" class="t title">Notch filter: reject one unwanted frequency</text>
<g transform="translate(80,100)"><line x1="0" y1="290" x2="500" y2="290" class="axis"/><line x1="0" y1="290" x2="0" y2="50" class="axis"/><path d="M0 85 H220 C238 85 242 285 250 285 C258 285 262 85 280 85 H500" class="red"/><line x1="250" y1="85" x2="250" y2="290" stroke="#E6E5E3" stroke-width="2"/><text x="235" y="322" class="t small">fo</text><text x="30" y="75" class="t small">pass</text><text x="325" y="75" class="t small">pass</text><text x="210" y="260" class="t small">reject</text><text x="0" y="365" class="t txt">At fo, numerator becomes zero → Vout ≈ 0</text></g>
<rect x="640" y="120" width="285" height="210" rx="14" class="note"/><text x="665" y="160" class="t txt">Twin-T notch</text><text x="665" y="205" class="t small">fo = 1/(2πRC)</text><text x="665" y="245" class="t small">Example use:</text><text x="665" y="275" class="t small">remove 50 Hz hum</text><text x="665" y="305" class="t small">Higher Q → narrower notch</text>

</svg>