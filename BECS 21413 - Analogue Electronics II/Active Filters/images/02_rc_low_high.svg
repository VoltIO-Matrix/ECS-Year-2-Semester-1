<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="430" viewBox="0 0 1050 430">
<rect width="1050" height="430" fill="#ffffff"/>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#2C2C2B} .title{font-size:28px;font-weight:700} .txt{font-size:20px} .small{font-size:16px} .wire{stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round} .axis{stroke:#7D7A75;stroke-width:2;fill:none;stroke-linecap:round} .blue{stroke:#2783DE;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .green{stroke:#46A171;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .orange{stroke:#D5803B;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .red{stroke:#E56458;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .box{fill:#F9F8F7;stroke:#E6E5E3;stroke-width:2} .note{fill:#E5F2FC;stroke:#2783DE;stroke-width:2} .op{fill:#F0EFED;stroke:#2C2C2B;stroke-width:3}
</style>

<text x="35" y="45" class="t title">RC idea behind low-pass and high-pass filters</text>
<g transform="translate(70,100)">
<text x="0" y="0" class="t txt">RC low-pass</text><line x1="0" y1="90" x2="120" y2="90" class="wire"/><path d="M120 90 l10 -16 l10 32 l10 -32 l10 32 l10 -32 l10 16" class="wire"/><line x1="190" y1="90" x2="300" y2="90" class="wire"/><line x1="300" y1="90" x2="300" y2="145" class="wire"/><line x1="285" y1="145" x2="315" y2="145" class="wire"/><line x1="285" y1="168" x2="315" y2="168" class="wire"/><line x1="300" y1="168" x2="300" y2="215" class="wire"/><line x1="270" y1="215" x2="330" y2="215" class="wire"/><text x="5" y="75" class="t small">Vin</text><text x="320" y="78" class="t small">Vout</text><text x="140" y="58" class="t small">R</text><text x="325" y="160" class="t small">C</text><text x="0" y="275" class="t small">Low f: capacitor open → Vout high</text><text x="0" y="305" class="t small">High f: capacitor short → Vout low</text></g>
<g transform="translate(595,100)">
<text x="0" y="0" class="t txt">RC high-pass</text><line x1="0" y1="90" x2="115" y2="90" class="wire"/><line x1="115" y1="65" x2="115" y2="115" class="wire"/><line x1="145" y1="65" x2="145" y2="115" class="wire"/><line x1="145" y1="90" x2="280" y2="90" class="wire"/><path d="M280 90 v20 l-16 10 l32 10 l-32 10 l32 10 l-16 10 v45" class="wire"/><line x1="250" y1="205" x2="310" y2="205" class="wire"/><text x="5" y="75" class="t small">Vin</text><text x="300" y="78" class="t small">Vout</text><text x="115" y="55" class="t small">C</text><text x="310" y="145" class="t small">R</text><text x="0" y="275" class="t small">Low f: capacitor open → Vout low</text><text x="0" y="305" class="t small">High f: capacitor short → Vout high</text></g>

</svg>