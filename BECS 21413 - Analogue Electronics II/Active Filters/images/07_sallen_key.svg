<text x="35" y="45" class="t title">Sallen-Key second-order filter idea</text>
<g transform="translate(70,100)"><text x="0" y="0" class="t txt">RC network creates frequency selection</text><line x1="0" y1="120" x2="90" y2="120" class="wire"/><path d="M90 120 l10 -16 l10 32 l10 -32 l10 32 l10 -32 l10 16" class="wire"/><line x1="160" y1="120" x2="250" y2="120" class="wire"/><path d="M250 120 l10 -16 l10 32 l10 -32 l10 32 l10 -32 l10 16" class="wire"/><line x1="320" y1="120" x2="430" y2="120" class="wire"/><line x1="210" y1="120" x2="210" y2="185" class="wire"/><line x1="195" y1="185" x2="225" y2="185" class="wire"/><line x1="195" y1="208" x2="225" y2="208" class="wire"/><line x1="210" y1="208" x2="210" y2="250" class="wire"/><line x1="180" y1="250" x2="240" y2="250" class="wire"/><line x1="345" y1="120" x2="345" y2="185" class="wire"/><line x1="330" y1="185" x2="360" y2="185" class="wire"/><line x1="330" y1="208" x2="360" y2="208" class="wire"/><line x1="345" y1="208" x2="345" y2="250" class="wire"/><line x1="315" y1="250" x2="375" y2="250" class="wire"/><polygon points="430,70 430,190 585,130" class="op"/><line x1="585" y1="130" x2="710" y2="130" class="wire"/><path d="M620 130 V40 H395 V90 H430" class="wire"/><text x="100" y="88" class="t small">R2</text><text x="265" y="88" class="t small">R3</text><text x="228" y="205" class="t small">C1</text><text x="363" y="205" class="t small">C2</text><text x="730" y="135" class="t small">Vo</text></g>
<rect x="70" y="370" width="940" height="70" rx="14" class="note"/><text x="95" y="414" class="t txt">Equal components: fc = 1/(2πRC), Q = 1/(3−Ao), Ao = 1 + Rf/R1</text>

