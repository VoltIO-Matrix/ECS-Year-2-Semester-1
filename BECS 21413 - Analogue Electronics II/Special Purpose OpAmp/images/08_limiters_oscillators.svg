<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
<rect width="1120" height="560" fill="#ffffff"/>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#2C2C2B} .title{font-size:28px;font-weight:700} .txt{font-size:20px} .small{font-size:16px} .tiny{font-size:14px} .wire{stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round} .axis{stroke:#7D7A75;stroke-width:2;fill:none;stroke-linecap:round} .blue{stroke:#2783DE;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .green{stroke:#46A171;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .orange{stroke:#D5803B;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .red{stroke:#E56458;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .box{fill:#F9F8F7;stroke:#E6E5E3;stroke-width:2} .note{fill:#E5F2FC;stroke:#2783DE;stroke-width:2} .op{fill:#F0EFED;stroke:#2C2C2B;stroke-width:3}
</style>

<text x="35" y="45" class="t title">Voltage limiters and waveform generators</text>
<g transform="translate(70,95)"><text x="0" y="0" class="t txt">Zener output bounding</text><line x1="0" y1="155" x2="350" y2="155" class="axis"/><line x1="175" y1="235" x2="175" y2="55" class="axis"/><path d="M40 215 C120 210 145 185 175 155 C205 125 230 95 310 90" class="blue"/><path d="M40 215 H130 C150 215 160 205 175 155 C190 105 200 90 310 90" class="orange"/><line x1="0" y1="90" x2="350" y2="90" stroke="#E56458" stroke-width="3" stroke-dasharray="8 8"/><line x1="0" y1="215" x2="350" y2="215" stroke="#E56458" stroke-width="3" stroke-dasharray="8 8"/><text x="260" y="82" class="t small">+limit</text><text x="260" y="235" class="t small">−limit</text><text x="0" y="300" class="t small">Limiter keeps comparator output inside selected voltage bounds.</text></g>
<g transform="translate(610,95)"><text x="0" y="0" class="t txt">Oscillator idea</text><rect x="0" y="75" width="230" height="100" rx="14" class="note"/><text x="62" y="133" class="t txt">Amplifier</text><line x1="230" y1="125" x2="350" y2="125" class="wire"/><text x="360" y="130" class="t small">Vout</text><path d="M300 125 V250 H60 V175" class="wire"/><rect x="30" y="250" width="250" height="85" rx="14" class="note"/><text x="55" y="300" class="t txt">feedback circuit</text><text x="0" y="385" class="t small">Feedback oscillator: positive feedback with correct phase.</text><text x="0" y="415" class="t small">Relaxation oscillator: capacitor charges/discharges through R.</text></g>

</svg>