<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
<rect width="1120" height="560" fill="#ffffff"/>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#2C2C2B} .title{font-size:28px;font-weight:700} .txt{font-size:20px} .small{font-size:16px} .tiny{font-size:14px} .wire{stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round} .axis{stroke:#7D7A75;stroke-width:2;fill:none;stroke-linecap:round} .blue{stroke:#2783DE;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .green{stroke:#46A171;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .orange{stroke:#D5803B;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .red{stroke:#E56458;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .box{fill:#F9F8F7;stroke:#E6E5E3;stroke-width:2} .note{fill:#E5F2FC;stroke:#2783DE;stroke-width:2} .op{fill:#F0EFED;stroke:#2C2C2B;stroke-width:3}
</style>

<text x="35" y="45" class="t title">Instrumentation amplifier — amplify V2−V1 and reject common noise</text>
<rect x="70" y="130" width="210" height="90" rx="12" class="note"/><text x="95" y="165" class="t txt">Sensor line 1</text><text x="100" y="195" class="t small">V1 + common noise</text>
<rect x="70" y="300" width="210" height="90" rx="12" class="note"/><text x="95" y="335" class="t txt">Sensor line 2</text><text x="100" y="365" class="t small">V2 + common noise</text>
<line x1="280" y1="175" x2="420" y2="175" class="wire"/><line x1="280" y1="345" x2="420" y2="345" class="wire"/>
<polygon points="420,105 420,245 590,175" class="op"/><polygon points="420,275 420,415 590,345" class="op"/><text x="460" y="180" class="t txt">A1</text><text x="460" y="350" class="t txt">A2</text>
<line x1="590" y1="175" x2="710" y2="220" class="wire"/><line x1="590" y1="345" x2="710" y2="300" class="wire"/>
<polygon points="710,200 710,320 885,260" class="op"/><text x="760" y="266" class="t txt">A3</text><line x1="885" y1="260" x2="1010" y2="260" class="wire"/><text x="1018" y="266" class="t txt">Vout</text>
<path d="M455 245 V275" class="wire"/><rect x="435" y="245" width="40" height="30" class="box"/><text x="430" y="235" class="t small">RG</text>
<rect x="90" y="455" width="900" height="65" rx="14" class="note"/><text x="120" y="493" class="t txt">Main idea: very high input impedance + high CMRR + gain for small differential signal</text>

</svg>