<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560">
<rect width="1080" height="560" fill="#ffffff"/>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#2C2C2B} .title{font-size:28px;font-weight:700} .txt{font-size:20px} .small{font-size:16px} .tiny{font-size:14px} .wire{stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round} .axis{stroke:#7D7A75;stroke-width:2;fill:none;stroke-linecap:round} .blue{stroke:#2783DE;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .green{stroke:#46A171;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .orange{stroke:#D5803B;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .red{stroke:#E56458;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .box{fill:#F9F8F7;stroke:#E6E5E3;stroke-width:2} .note{fill:#E5F2FC;stroke:#2783DE;stroke-width:2} .op{fill:#F0EFED;stroke:#2C2C2B;stroke-width:3}
</style>

<text x="35" y="45" class="t title">Schmitt trigger — comparator with hysteresis</text>
<g transform="translate(70,95)"><text x="0" y="0" class="t txt">Why Schmitt trigger?</text><rect x="0" y="45" width="405" height="155" rx="14" class="note"/><text x="25" y="85" class="t small">Ordinary comparator can chatter when input is noisy</text><text x="25" y="120" class="t small">near the threshold.</text><text x="25" y="155" class="t small">Schmitt trigger uses two switching levels:</text><text x="25" y="185" class="t small">upper trip point VU and lower trip point VL.</text></g>
<g transform="translate(600,90)"><text x="0" y="0" class="t txt">Inverting Schmitt VTC</text><line x1="0" y1="270" x2="380" y2="270" class="axis"/><line x1="190" y1="330" x2="190" y2="40" class="axis"/><path d="M40 75 H245 V270 H340" class="blue"/><path d="M340 270 H135 V75 H40" class="orange"/><line x1="135" y1="60" x2="135" y2="290" stroke="#E6E5E3" stroke-width="2"/><line x1="245" y1="60" x2="245" y2="290" stroke="#E6E5E3" stroke-width="2"/><text x="118" y="315" class="t small">VL</text><text x="230" y="315" class="t small">VU</text><text x="250" y="72" class="t small">+Vsat</text><text x="250" y="288" class="t small">−Vsat</text><text x="315" y="350" class="t small">Vin</text></g>
<rect x="80" y="350" width="870" height="120" rx="14" class="box"/><text x="110" y="390" class="t txt">For simple inverting Schmitt trigger:</text><text x="110" y="425" class="t small">VU = [R1/(R1+R2)](+Vsat),    VL = [R1/(R1+R2)](−Vsat)</text><text x="110" y="455" class="t small">Hysteresis width = VU − VL</text>

</svg>