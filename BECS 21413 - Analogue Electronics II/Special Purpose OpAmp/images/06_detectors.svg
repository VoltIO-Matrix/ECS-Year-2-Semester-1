<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480">
<rect width="1080" height="480" fill="#ffffff"/>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#2C2C2B} .title{font-size:28px;font-weight:700} .txt{font-size:20px} .small{font-size:16px} .tiny{font-size:14px} .wire{stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round} .axis{stroke:#7D7A75;stroke-width:2;fill:none;stroke-linecap:round} .blue{stroke:#2783DE;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .green{stroke:#46A171;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .orange{stroke:#D5803B;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .red{stroke:#E56458;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .box{fill:#F9F8F7;stroke:#E6E5E3;stroke-width:2} .note{fill:#E5F2FC;stroke:#2783DE;stroke-width:2} .op{fill:#F0EFED;stroke:#2C2C2B;stroke-width:3}
</style>

<text x="35" y="45" class="t title">Zero-level and threshold detectors</text>
<g transform="translate(70,95)"><text x="0" y="0" class="t txt">Zero-level detector</text><line x1="0" y1="155" x2="340" y2="155" class="axis"/><path d="M0 155 C45 65 95 65 140 155 C185 245 235 245 280 155 C300 115 320 95 340 95" class="blue"/><path d="M0 285 H70 V80 H140 V285 H210 V80 H280 V285 H340" class="green"/><text x="0" y="330" class="t small">Output changes state whenever input crosses 0 V.</text></g>
<g transform="translate(585,95)"><text x="0" y="0" class="t txt">Threshold detector</text><line x1="0" y1="155" x2="340" y2="155" class="axis"/><line x1="0" y1="115" x2="340" y2="115" stroke="#D5803B" stroke-width="3" stroke-dasharray="8 8"/><text x="285" y="108" class="t small">VT</text><path d="M0 155 C45 65 95 65 140 155 C185 245 235 245 280 155 C300 115 320 95 340 95" class="blue"/><path d="M0 285 H55 V80 H125 V285 H270 V80 H340" class="green"/><text x="0" y="330" class="t small">Output changes state when input crosses VT.</text></g>

</svg>