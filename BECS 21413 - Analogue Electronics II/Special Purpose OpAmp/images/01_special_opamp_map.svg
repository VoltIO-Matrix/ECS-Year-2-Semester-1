<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
<rect width="1120" height="560" fill="#ffffff"/>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#2C2C2B} .title{font-size:28px;font-weight:700} .txt{font-size:20px} .small{font-size:16px} .tiny{font-size:14px} .wire{stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round} .axis{stroke:#7D7A75;stroke-width:2;fill:none;stroke-linecap:round} .blue{stroke:#2783DE;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .green{stroke:#46A171;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .orange{stroke:#D5803B;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .red{stroke:#E56458;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .box{fill:#F9F8F7;stroke:#E6E5E3;stroke-width:2} .note{fill:#E5F2FC;stroke:#2783DE;stroke-width:2} .op{fill:#F0EFED;stroke:#2C2C2B;stroke-width:3}
</style>

<text x="35" y="45" class="t title">Special-purpose op-amp circuits — big picture</text>
<rect x="60" y="95" width="290" height="105" rx="14" class="note"/><text x="90" y="135" class="t txt">Instrumentation amplifier</text><text x="90" y="168" class="t small">small differential signal + large noise</text>
<rect x="415" y="95" width="290" height="105" rx="14" class="note"/><text x="465" y="135" class="t txt">Isolation amplifier</text><text x="445" y="168" class="t small">input and output electrically isolated</text>
<rect x="770" y="95" width="290" height="105" rx="14" class="note"/><text x="835" y="135" class="t txt">Converters</text><text x="815" y="168" class="t small">I→V, V→I, constant current</text>
<rect x="60" y="260" width="290" height="105" rx="14" class="note"/><text x="130" y="300" class="t txt">Comparators</text><text x="95" y="333" class="t small">analogue input → binary output</text>
<rect x="415" y="260" width="290" height="105" rx="14" class="note"/><text x="475" y="300" class="t txt">Schmitt trigger</text><text x="455" y="333" class="t small">comparator + hysteresis</text>
<rect x="770" y="260" width="290" height="105" rx="14" class="note"/><text x="835" y="300" class="t txt">Limiters</text><text x="810" y="333" class="t small">bound output with Zener diodes</text>
<rect x="250" y="420" width="620" height="85" rx="14" class="box"/><text x="330" y="455" class="t txt">Waveform generators</text><text x="330" y="485" class="t small">oscillators, feedback oscillators, relaxation oscillators</text>

</svg>