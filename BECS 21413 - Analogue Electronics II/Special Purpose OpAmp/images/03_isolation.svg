<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="470" viewBox="0 0 1060 470">
<rect width="1060" height="470" fill="#ffffff"/>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#2C2C2B} .title{font-size:28px;font-weight:700} .txt{font-size:20px} .small{font-size:16px} .tiny{font-size:14px} .wire{stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round} .axis{stroke:#7D7A75;stroke-width:2;fill:none;stroke-linecap:round} .blue{stroke:#2783DE;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .green{stroke:#46A171;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .orange{stroke:#D5803B;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .red{stroke:#E56458;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round} .box{fill:#F9F8F7;stroke:#E6E5E3;stroke-width:2} .note{fill:#E5F2FC;stroke:#2783DE;stroke-width:2} .op{fill:#F0EFED;stroke:#2C2C2B;stroke-width:3}
</style>

<text x="35" y="45" class="t title">Isolation amplifier — signal crosses an isolation barrier</text>
<rect x="70" y="150" width="250" height="130" rx="14" class="note"/><text x="120" y="195" class="t txt">Input stage</text><text x="105" y="230" class="t small">patient / sensor / high voltage side</text>
<rect x="740" y="150" width="250" height="130" rx="14" class="note"/><text x="795" y="195" class="t txt">Output stage</text><text x="790" y="230" class="t small">safe measuring side</text>
<line x1="25" y1="215" x2="70" y2="215" class="wire"/><line x1="990" y1="215" x2="1030" y2="215" class="wire"/>
<line x1="530" y1="90" x2="530" y2="345" stroke="#E56458" stroke-width="5" stroke-dasharray="12 10"/><text x="455" y="70" class="t txt">Isolation barrier</text>
<path d="M320 215 C410 150 450 280 530 215 C610 150 650 280 740 215" class="blue"/>
<text x="405" y="365" class="t small">Coupling can be optical, transformer, or capacitive.</text>
<text x="385" y="400" class="t small">No common electrical path between input and output grounds.</text>

</svg>