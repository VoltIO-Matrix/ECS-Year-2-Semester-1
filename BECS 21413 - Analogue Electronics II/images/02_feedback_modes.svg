<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380">
  
  <rect style="fill:#ffffff" x="0" y="0" width="920" height="380"/>
  
<text x="24" y="42" style="font-family:Arial,Helvetica,sans-serif;font-size:26px;font-weight:700;fill:#2C2C2B">Open-loop vs closed-loop operation</text>
<polygon style="stroke:#2C2C2B;stroke-width:3;fill:#F0EFED;stroke-linejoin:round" points="115,110 115,250 280,180"/><line style="stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round" x1="25" y1="140" x2="115" y2="140"/><line style="stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round" x1="25" y1="220" x2="115" y2="220"/><line style="stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round" x1="280" y1="180" x2="370" y2="180"/>
<text x="42" y="130" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#2C2C2B">V+</text><text x="42" y="245" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#2C2C2B">V−</text><text x="170" y="185" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#2C2C2B">AOL</text><text x="70" y="310" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#2C2C2B">Open loop: no feedback, very high gain</text>
<polygon style="stroke:#2C2C2B;stroke-width:3;fill:#F0EFED;stroke-linejoin:round" points="590,110 590,250 755,180"/><line style="stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round" x1="500" y1="140" x2="590" y2="140"/><line style="stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round" x1="755" y1="180" x2="870" y2="180"/><line style="stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round" x1="815" y1="180" x2="815" y2="285"/><path style="stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round" d="M815 285 H555 V220 H590"/>
<text x="520" y="130" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#2C2C2B">Vin</text><text x="795" y="168" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#2C2C2B">Vout</text><text x="580" y="310" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#2C2C2B">Closed loop: output is fed back</text>
<text x="580" y="340" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#2C2C2B">Negative feedback makes gain stable and predictable.</text>
</svg>