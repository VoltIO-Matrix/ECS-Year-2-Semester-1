<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="350" viewBox="0 0 1010 350">
  
  <rect style="fill:#ffffff" x="0" y="0" width="1010" height="350"/>
  
<text x="24" y="42" style="font-family:Arial,Helvetica,sans-serif;font-size:26px;font-weight:700;fill:#2C2C2B">Input modes</text>
<rect x="35" y="80" width="280" height="230" rx="14" style="fill:#E5F2FC;stroke:#2783DE;stroke-width:2"/><rect x="365" y="80" width="280" height="230" rx="14" style="fill:#E5F2FC;stroke:#2783DE;stroke-width:2"/><rect x="695" y="80" width="280" height="230" rx="14" style="fill:#E5F2FC;stroke:#2783DE;stroke-width:2"/>
<text x="65" y="122" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#2C2C2B">Single-ended</text><text x="65" y="154" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#2C2C2B">differential</text><text x="65" y="200" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#2C2C2B">One input has signal.</text><text x="65" y="230" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#2C2C2B">Other input is grounded.</text>
<text x="395" y="122" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#2C2C2B">Double-ended</text><text x="395" y="154" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#2C2C2B">differential</text><text x="395" y="200" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#2C2C2B">Two opposite-polarity</text><text x="395" y="230" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#2C2C2B">signals are applied.</text>
<text x="725" y="122" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#2C2C2B">Common mode</text><text x="725" y="200" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#2C2C2B">Same signal appears at</text><text x="725" y="230" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#2C2C2B">both inputs and is rejected.</text>
<path style="stroke:#2783DE;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round" d="M110 278 q35 -70 70 0"/><path style="stroke:#46A171;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round" d="M445 278 q35 -70 70 0"/><path style="stroke:#D5803B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round" d="M505 208 q35 70 70 0"/><path style="stroke:#2783DE;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round" d="M780 250 q35 -70 70 0 M860 250 q35 -70 70 0"/>
</svg>