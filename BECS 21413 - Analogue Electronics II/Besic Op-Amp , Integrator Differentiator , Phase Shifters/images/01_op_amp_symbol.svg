<line style="stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round" x1="330" y1="105" x2="330" y2="70"/><line style="stroke:#2C2C2B;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round" x1="330" y1="285" x2="330" y2="332"/>
<text x="270" y="138" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#2C2C2B">−</text><text x="270" y="258" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#2C2C2B">+</text>
<text x="100" y="118" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#2C2C2B">V− inverting input</text><text x="100" y="278" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#2C2C2B">V+ non-inverting input</text>
<text x="505" y="180" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#2C2C2B">Vout</text><text x="345" y="72" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#2C2C2B">+VCC</text><text x="345" y="338" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#2C2C2B">−VCC</text>
<rect x="655" y="82" width="405" height="215" rx="14" style="fill:#E5F2FC;stroke:#2783DE;stroke-width:2"/>
<text x="680" y="125" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#2C2C2B">Ideal rules</text>
<text x="680" y="165" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#2C2C2B">1. V+ = V− when negative feedback works</text>
<text x="680" y="198" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#2C2C2B">2. Input currents I+ = I− = 0</text>
<text x="680" y="231" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#2C2C2B">3. Output resistance = 0</text>
<text x="680" y="264" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#2C2C2B">4. Open-loop gain is very large</text>
