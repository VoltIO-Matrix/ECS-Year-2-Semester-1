<circle style="stroke:#2C2C2B;stroke-width:3;fill:#F0EFED;stroke-linejoin:round" cx="80" cy="130" r="6"/><circle style="stroke:#2C2C2B;stroke-width:3;fill:#F0EFED;stroke-linejoin:round" cx="80" cy="250" r="6"/>
